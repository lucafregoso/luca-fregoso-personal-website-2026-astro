version: 2
updates:
  # npm covers the pnpm workspace (package.json + pnpm-lock.yaml) —
  # the site's real dependencies: Astro, Playwright, Fontsource, etc.
  - package-ecosystem: "npm"
    directory: "/"
    # git flow: dependency bumps land on develop and ship with a release
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    ignore:
      # astro check refuses TypeScript 7 ("install TypeScript 6 instead").
      # Drop this once Astro's type-checker supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
